    <!-- LOGIN -->

    <div id="login">

        <h1>🌻💐 "Flores Amarillas" 💐🌻</h1>
        

        <input
            type="text"
            id="nombre"
            placeholder="Ingresa tu nombre">

        <button onclick="entrar()">
            Entrar
        </button>

    <!-- JARDÍN -->
<div id="jardin">

    <h1 id="mensaje"></h1>
    <p id="dedicatoria">


Las flores amarillas representan
alegría, esperanza y momentos
que iluminan la vida 💛
</p>

<p id="fecha"></p>


    <div id="garden-svg">

        <div class="svg-flower flower1">
            <svg viewBox="0 0 200 400">

    <!-- Tallo -->

    <path
        d="M100 330 Q90 250 100 120"
        stroke="#66ff99"
        stroke-width="10"
        fill="none"
        stroke-linecap="round"
    />

    <!-- Hoja izquierda -->

    <path
        d="M100 250
           Q40 220 70 170
           Q120 190 100 250"
        fill="#50fa7b"
    />

    <!-- Hoja derecha -->

    <path
        d="M100 210
           Q150 170 130 120
           Q80 160 100 210"
        fill="#69ff9b"
    />

<!-- pétalo izquierdo -->
<ellipse
    cx="65"
    cy="100"
    rx="35"
    ry="22"
    fill="#ffd93d"
    transform="rotate(-25 65 100)"
/>

<!-- pétalo derecho -->
<ellipse
    cx="135"
    cy="100"
    rx="35"
    ry="22"
    fill="#ffd93d"
    transform="rotate(25 135 100)"
/>

<!-- pétalo superior -->
<ellipse
    cx="100"
    cy="70"
    rx="28"
    ry="40"
    fill="#fff176"
/>

<!-- pétalo central -->

<ellipse
    cx="100"
    cy="105"
    rx="30"
    ry="25"
    fill="#fff59d"
/>

    <!-- Centro -->

    <circle
        cx="100"
        cy="105"
        r="12"
        fill="#fffde7"
    />

</svg>

        </div>
